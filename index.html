<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Facts">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Math Facts</title>

<!-- Setup lives in config.js. Each kid's range and timer come from the
     Sheet and are edited on the parent dashboard, not here. -->
<script src="config.js"></script>

<style>
  :root{
    --bg:#0b1220; --card:#161f36; --ink:#f3f6ff; --muted:#9fb0d0;
    --accent:#4f9cff; --good:#31c48d; --bad:#f96a6a;
    --pad:#233150; --pad-press:#31446e;
    /* Session progress must NOT be --accent: the countdown ring owns the
       blue/amber/red palette, and a bar in those colors reads as time left
       rather than problems done. Violet is outside the timer palette and
       outside the green used for correct answers. */
    --progress:#a78bfa; --progress-track:#1a2338;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
    overflow:hidden;
  }
  .screen{
    display:none; flex-direction:column; height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  }
  .screen.on{display:flex}

  /* ---------------- picker & start ---------------- */
  #screen-pick,#screen-start{align-items:center;justify-content:center;text-align:center;gap:8px}
  .hello{font-size:32px;font-weight:800}
  .sub{color:var(--muted);font-size:16px;line-height:1.6}
  .big-btn{
    margin-top:22px;border:0;border-radius:22px;padding:22px 56px;
    font-size:28px;font-weight:800;color:#04121f;
    background:linear-gradient(180deg,#63b0ff,#2b7fe0);box-shadow:0 8px 0 #1a5aa8;
  }
  .big-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #1a5aa8}
  .who{display:flex;flex-direction:column;gap:14px;margin-top:24px;width:100%;max-width:300px}
  .who button{
    border:0;border-radius:20px;padding:24px;font-size:26px;font-weight:800;
    background:var(--pad);color:var(--ink);
  }
  .who button:active{background:var(--pad-press)}
  .note{margin-top:18px;font-size:13px;color:var(--muted);max-width:300px;line-height:1.5}
  .record{
    margin-top:16px;background:var(--card);border-radius:14px;padding:11px 18px;
    font-size:15px;color:var(--muted);line-height:1.5;
  }
  .record b{color:var(--ink);font-weight:800}
  .record .beat{color:var(--progress);font-weight:800}
  /* So "is this phone actually running the new code?" is answerable at a
     glance instead of by guesswork. */
  .ver{margin-top:20px;font-size:11px;color:#3d4a6b;letter-spacing:.04em}
  .compare{margin-top:10px;font-size:16px;font-weight:700;color:var(--muted);min-height:22px}
  .compare.best{color:#ffd76e}
  .compare.up{color:var(--good)}
  .switch{
    margin-top:16px;background:none;border:0;color:var(--muted);
    font-size:14px;text-decoration:underline;padding:8px;
  }

  /* ---------------- play ----------------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .counter{font-size:16px;font-weight:700;color:var(--muted);min-width:64px}
  .scorepill{
    font-size:15px;font-weight:800;background:var(--card);
    padding:6px 14px;border-radius:999px;color:var(--good);min-width:44px;text-align:center;
  }
  .progress{height:3px;background:var(--progress-track);border-radius:99px;margin-top:12px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--progress);width:0;transition:width .25s}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .ring{position:relative;width:74px;height:74px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;
  }
  .problem{font-size:clamp(50px,17vw,86px);font-weight:800;letter-spacing:2px;line-height:1.1}
  .answer{
    min-width:180px;text-align:center;font-size:48px;font-weight:800;
    border-bottom:5px solid var(--pad);padding:2px 14px 8px;min-height:68px;
  }
  .answer.ok{border-color:var(--good);color:var(--good)}
  .answer.no{border-color:var(--bad);color:var(--bad)}
  .verdict{height:28px;font-size:20px;font-weight:700;color:var(--muted)}
  .verdict.ok{color:var(--good)}
  .verdict.no{color:var(--bad)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:6px}
  .key{
    border:0;border-radius:16px;background:var(--pad);color:var(--ink);
    font-size:30px;font-weight:800;padding:18px 0;min-height:62px;
  }
  .key:active{background:var(--pad-press)}
  .key.go{background:var(--good);color:#04211a}
  .key.del{background:#3a2740;color:#ffd7d7;font-size:24px}

  /* ---------------- done ----------------- */
  #screen-done{overflow-y:auto;gap:2px;-webkit-overflow-scrolling:touch}
  .result{text-align:center;padding-top:6px}
  .result .score{font-size:66px;font-weight:800;line-height:1}
  .result .of{color:var(--muted);font-size:18px;font-weight:700}
  .stats{display:flex;gap:10px;margin-top:14px}
  .stat{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--muted)}
  h2{font-size:15px;margin:20px 0 8px;color:var(--muted);font-weight:700}
  .miss{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  }
  .miss .fact{font-size:20px;font-weight:800;white-space:nowrap}
  .miss .said{font-size:13px;color:var(--muted);text-align:right}
  .miss .said b{color:var(--bad)}
  .miss .said b.had{color:var(--good)}
  .perfect{background:var(--card);border-radius:14px;padding:20px;text-align:center;font-size:18px}
  .status{border-radius:14px;padding:14px;font-size:15px;line-height:1.5;margin-top:18px}
  .status.sending{background:#1b2540;color:var(--muted)}
  .status.sent{background:#11331f;color:#8ff0c4}
  .status.failed{background:#3a1c1c;color:#ffc9c9}
  /* The reason is for the parent, not the kid - small and out of the way. */
  .status .why{display:block;margin-top:9px;font-size:12px;opacity:.7;font-family:ui-monospace,Menlo,Consolas,monospace}
  .again{
    margin:14px 0 6px;width:100%;border:0;border-radius:18px;padding:18px;
    font-size:20px;font-weight:800;background:var(--pad);color:var(--ink);
  }
  .retry{
    margin-top:10px;border:0;border-radius:12px;padding:10px 18px;
    font-size:14px;font-weight:700;background:#5a2b2b;color:#ffdada;
  }

  /* Short phones (320x568, the first-gen SE): at full size the bottom keypad
     row - delete, 0 and the check - fell off the bottom of the screen. */
  @media (max-height:620px){
    .screen{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
    .ring{width:58px;height:58px}
    .ring svg{width:58px;height:58px}
    .ring .num{font-size:21px}
    .progress{margin-top:8px}
    .stage{gap:4px}
    .problem{font-size:clamp(42px,14vw,64px)}
    .answer{font-size:38px;min-height:54px;padding-bottom:4px}
    .verdict{height:24px;font-size:17px}
    .pad{gap:8px}
    .key{padding:10px 0;min-height:50px;font-size:26px}
    .key.del{font-size:21px}
  }
</style>
</head>
<body>

<!-- ======================= WHO'S PRACTICING ======================= -->
<section id="screen-pick" class="screen">
  <div class="hello">Math Facts</div>
  <div class="sub">Who's practicing?</div>
  <div class="who" id="whoList"></div>
</section>

<!-- ============================ START ============================ -->
<section id="screen-start" class="screen">
  <div class="hello" id="greeting">Math Facts</div>
  <div class="sub" id="startBlurb"></div>
  <div class="record" id="record"></div>
  <button class="big-btn" id="startBtn">Start</button>
  <button class="switch" id="soundBtn">Sound: on</button>
  <button class="switch" id="switchBtn" hidden>Not you? Switch</button>
  <div class="note" id="pendingNote" hidden></div>
  <div class="ver" id="ver"></div>
</section>

<!-- ============================ PLAY ============================= -->
<section id="screen-play" class="screen">
  <div>
    <div class="topbar">
      <div class="counter" id="counter">1 / 20</div>
      <div class="ring">
        <svg width="74" height="74" viewBox="0 0 74 74" aria-hidden="true">
          <circle cx="37" cy="37" r="32" fill="none" stroke="#233150" stroke-width="7"></circle>
          <circle id="ringArc" cx="37" cy="37" r="32" fill="none" stroke="#4f9cff"
                  stroke-width="7" stroke-linecap="round"
                  stroke-dasharray="201.06" stroke-dashoffset="0"></circle>
        </svg>
        <div class="num" id="ringNum">8</div>
      </div>
      <div class="scorepill" id="scorePill">0</div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>

  <div class="stage">
    <div class="problem" id="problem">7 &times; 8</div>
    <div class="answer" id="answer"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key del" data-k="del" aria-label="delete">&#9003;</button>
    <button class="key" data-k="0">0</button>
    <button class="key go" data-k="go" aria-label="enter">&#10003;</button>
  </div>
</section>

<!-- ============================ DONE ============================= -->
<section id="screen-done" class="screen">
  <div class="result">
    <div class="score" id="finalScore">0</div>
    <div class="of" id="finalOf">out of 20</div>
    <div class="compare" id="compare"></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="statAcc">—</b><span>accuracy</span></div>
    <div class="stat"><b id="statTime">—</b><span>total time</span></div>
    <div class="stat"><b id="statAvg">—</b><span>per problem</span></div>
  </div>

  <h2 id="missedHeading">Missed facts</h2>
  <div id="missedList"></div>

  <div class="status sending" id="sendStatus">Sending your score&hellip;</div>
  <button class="retry" id="retryBtn" hidden>Try sending again</button>

  <button class="again" id="againBtn">Practice again</button>
</section>

<script>
/* ------------------------------------------------------------------
   Shared settings come from config.js. Each kid's range / problem
   count / timer comes from the Sheet (edited on the dashboard), with
   the last synced copy cached on the phone so this still works with
   no signal.
   ------------------------------------------------------------------ */
var DEFAULTS = {
  SCRIPT_URL: '',
  SOUND: true,
  SHOW_CORRECT_ON_MISS: true,
  FEEDBACK_MS_CORRECT: 450,
  FEEDBACK_MS_WRONG: 1700,
  MAX_ANSWER_DIGITS: 3,
  AVOID_IMMEDIATE_REPEAT: true,
  KEEP_SCREEN_AWAKE: true,
  SEND_TIMEOUT_MS: 12000,       // after this, say "still sending" rather than fail
  SEND_GIVE_UP_MS: 60000        // only now is it actually a failure
};

var CONFIG = (function () {
  var out = {};
  var src = window.MATH_CONFIG || {};
  for (var k in DEFAULTS) {
    if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
      out[k] = (src[k] === undefined || src[k] === null || src[k] === '') ? DEFAULTS[k] : src[k];
    }
  }
  if (src.SCRIPT_URL) out.SCRIPT_URL = src.SCRIPT_URL;
  return out;
})();

// Shown small on the start screen. THE version number: bump it on every
// deploy (sw.js no longer needs a matching bump — see its header), so a phone
// running stale code is obvious rather than mysterious.
var APP_VERSION = 'v1.7';

var PENDING_KEY = 'mathfacts_pending_v1';
var REJECTED_KEY = 'mathfacts_rejected_v1';   // scores the server refused for good
var SETTINGS_KEY = 'mathfacts_settings_v1';
var WHO_KEY = 'mathfacts_student_v1';
var HISTORY_KEY = 'mathfacts_history_v1';
var SOUND_KEY = 'mathfacts_sound_v1';
var RING_C = 201.06;              // 2·π·r for r = 32, matching the SVG above

var STUDENTS = {};                // live settings, keyed by student key
var studentKey = '';              // who is practicing right now
var me = null;                    // STUDENTS[studentKey]

var S = null;                     // live session state
var rafId = null;
var wakeLock = null;
var acceptingInput = false;
var inSession = false;            // from Start until the score screen - wider than
                                  // acceptingInput, which is off between problems

function el(id) { return document.getElementById(id); }

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* --------------------------- helpers --------------------------- */

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function mmss(sec) {
  var t = Math.max(0, Math.round(sec));
  var m = Math.floor(t / 60);
  var s = t % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function show(id) {
  var all = document.querySelectorAll('.screen');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
  el(id).classList.add('on');
}

function urlLooksSet() {
  return typeof CONFIG.SCRIPT_URL === 'string' &&
         CONFIG.SCRIPT_URL.indexOf('http') === 0;
}

/* ------------------------ student settings ---------------------- */

function normalizeStudent(key, raw) {
  raw = raw || {};
  return {
    key: key,
    name: String(raw.name || key),
    minFactor: Number(raw.minFactor) || 1,
    maxFactor: Number(raw.maxFactor) || 12,
    problemsPerSession: Number(raw.problemsPerSession) || 20,
    secondsPerProblem: Number(raw.secondsPerProblem) || 10,
    focus: (raw.focus === '' || raw.focus === null || raw.focus === undefined ||
            !isFinite(Number(raw.focus)) || Number(raw.focus) <= 0)
             ? '' : Math.round(Number(raw.focus))
  };
}

function readCachedSettings() {
  try {
    var raw = localStorage.getItem(SETTINGS_KEY);
    var obj = raw ? JSON.parse(raw) : null;
    return (obj && typeof obj === 'object' && Object.keys(obj).length) ? obj : null;
  } catch (e) { return null; }
}

function applySettings(source) {
  STUDENTS = {};
  for (var k in source) {
    if (Object.prototype.hasOwnProperty.call(source, k)) {
      STUDENTS[String(k).toLowerCase()] = normalizeStudent(String(k).toLowerCase(), source[k]);
    }
  }
}

/** Cached settings win over the config.js fallback. */
function loadSettings() {
  applySettings(readCachedSettings() || (window.MATH_CONFIG && window.MATH_CONFIG.STUDENTS) || {});
}

/** Ask the Sheet for the current settings; harmless if it fails. */
function refreshSettings() {
  if (!urlLooksSet()) return;
  var url = CONFIG.SCRIPT_URL + (CONFIG.SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') +
            'settings=1&t=' + Date.now();

  fetch(url).then(function (r) { return r.json(); }).then(function (data) {
    if (!data || !data.ok || !data.settings || !Object.keys(data.settings).length) return;
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings)); } catch (e) {}

    // Never move the goalposts mid-session — not even in the pause between
    // problems. The copy just saved is picked up when the round ends.
    if (inSession) return;
    applySettings(data.settings);

    if (studentKey && STUDENTS[studentKey]) {
      me = STUDENTS[studentKey];
      paintStart();
    } else if (studentKey) {
      // This kid was removed on the dashboard. Do not leave them on a start
      // screen whose scores the server will refuse.
      studentKey = '';
      me = null;
      rememberStudent('');
      paintPicker();
      var keys = Object.keys(STUDENTS);
      if (keys.length === 1) chooseStudent(keys[0]);
      else { try { history.replaceState(null, '', location.pathname); } catch (e) {} show('screen-pick'); }
      return;
    } else if (!studentKey) {
      // A kid added on the dashboard is not in config.js, so at page load
      // their ?student= link had nobody to match and fell back to the
      // picker. Now that the real roster is here, honor the link.
      var wanted = studentFromUrl() || lastStudent();
      if (wanted && STUDENTS[wanted]) { chooseStudent(wanted); return; }
    }
    paintPicker();
  }).catch(function () {});
}

/* ------------------------ score history ------------------------- */
/* Kept on the phone, per kid, so "beat your last score" works instantly
   and with no signal. The Sheet remains the record for the dashboard. */

function readHistory() {
  try {
    var raw = localStorage.getItem(HISTORY_KEY);
    var obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
  } catch (e) { return {}; }
}

/**
 * Bests are kept per mode. A 20/20 on the 3s is a much easier round than
 * 20/20 mixed, so letting them share a record would make "beat your best"
 * meaningless the moment a table is picked.
 */
function histKey(key, focus) {
  return key + ((focus === '' || focus === undefined) ? '' : '#' + focus);
}

function historyFor(key) {
  var list = readHistory()[key];
  return Array.isArray(list) ? list : [];
}

function pushHistory(key, entry) {
  var all = readHistory();
  var list = Array.isArray(all[key]) ? all[key] : [];
  list.push(entry);
  all[key] = list.slice(-30);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(all)); } catch (e) {}
}

/**
 * Seconds per problem for a history entry, or null. Only entries with `a`
 * (answering time, v1.7+) count: older ones stored wall-clock time including
 * the feedback pauses, so they would make any new round look faster.
 */
function pace(entry) {
  return (entry && typeof entry.a === 'number' && entry.n) ? entry.a / entry.n : null;
}

/**
 * True if x was meaningfully faster than y: 0.05s a problem, i.e. a second
 * over a 20-problem round, so timer jitter cannot hand out records.
 */
function fasterThan(x, y) {
  var px = pace(x), py = pace(y);
  return px !== null && py !== null && px < py - 0.05;
}

/**
 * Best by accuracy, so a change in problem count does not fake a record.
 * A tie on accuracy goes to the faster round — otherwise a kid who gets
 * 20/20 every time has no record left to chase.
 */
function bestOf(list) {
  var best = null;
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (!best) { best = e; continue; }
    var r = e.s / e.n, rb = best.s / best.n;
    // On a tie, a timed round also replaces an untimed (pre-v1.7) one —
    // otherwise an old untimed record could never be beaten on speed.
    if (r > rb || (r === rb && (fasterThan(e, best) || (pace(best) === null && pace(e) !== null)))) {
      best = e;
    }
  }
  return best;
}

/* ---------------------------- sound ----------------------------- */
/* Synthesized, so there is nothing to download and it works offline.
   iOS will not start audio outside a user gesture, so the context is
   created on the first tap and resumed on every session start. */

var audioCtx = null;

function soundOn() {
  try {
    var v = localStorage.getItem(SOUND_KEY);
    return v === null ? (CONFIG.SOUND !== false) : v === '1';
  } catch (e) { return CONFIG.SOUND !== false; }
}

function setSoundOn(on) {
  try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (e) {}
  paintSoundBtn();
  if (on) { wakeAudio(); blip(880, 0.07, 0.16); }
}

function paintSoundBtn() {
  el('soundBtn').textContent = soundOn() ? 'Sound: on' : 'Sound: off';
}

function wakeAudio() {
  if (!soundOn()) return;
  try {
    // iOS puts Web Audio in the "ambient" session by default, which the
    // hardware ring/silent switch mutes — so a phone on silent plays nothing
    // at all. 'playback' is the category that keeps sounding regardless.
    // Safari 16.4+; harmless where it does not exist.
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
  } catch (e) {}

  try {
    if (!audioCtx) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      audioCtx = new Ctor();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}

function blip(freq, dur, peak, type, delay) {
  if (!audioCtx || !soundOn()) return;
  try {
    var at = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, at);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak, at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.03);
  } catch (e) {}
}

// Triangle rather than sine: richer harmonics carry far better on a phone
// speaker, where a pure sine at low volume is easy to miss entirely.
function playCorrect() { blip(880, 0.11, 0.34, 'triangle'); blip(1318.5, 0.17, 0.30, 'triangle', 0.085); }
function playWrong()   { blip(233.1, 0.16, 0.26, 'triangle'); blip(185, 0.21, 0.22, 'triangle', 0.10); }
function playFinish() {
  blip(659.3, 0.12, 0.28, 'triangle', 0);
  blip(830.6, 0.12, 0.28, 'triangle', 0.12);
  blip(987.8, 0.26, 0.30, 'triangle', 0.24);
}

/* ---------------------- who is practicing ----------------------- */

function studentFromUrl() {
  var m = /[?&]student=([^&]+)/i.exec(location.search);
  return m ? decodeURIComponent(m[1]).trim().toLowerCase() : '';
}

function rememberStudent(key) {
  try { localStorage.setItem(WHO_KEY, key); } catch (e) {}
}

function lastStudent() {
  try { return (localStorage.getItem(WHO_KEY) || '').toLowerCase(); } catch (e) { return ''; }
}

/**
 * iOS 16.4+ installs a home-screen app at the manifest's start_url, throwing
 * away the ?student= the page was opened with. Point the manifest link at
 * that kid's own manifest, whose start_url carries their key, so their icon
 * launches as them. (If a kid has no manifest file the link 404s, the
 * manifest is ignored, and iOS falls back to the current URL — which still
 * has the query. Either way it lands on the right kid.)
 */
function applyHomeScreenIdentity(key) {
  var link = document.querySelector('link[rel="manifest"]');
  if (link) link.setAttribute('href', encodeURIComponent(key) + '.webmanifest');
  var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (title && STUDENTS[key]) title.setAttribute('content', STUDENTS[key].name);
}

function chooseStudent(key) {
  studentKey = key;
  me = STUDENTS[key];
  rememberStudent(key);
  // Keep the URL in step, so adding THIS page to the home screen
  // remembers which kid it is.
  try {
    history.replaceState(null, '', location.pathname + '?student=' + encodeURIComponent(key));
  } catch (e) {}
  paintStart();
  show('screen-start');
}

function paintPicker() {
  var list = el('whoList');
  list.innerHTML = '';
  var keys = Object.keys(STUDENTS);
  for (var i = 0; i < keys.length; i++) {
    (function (k) {
      var b = document.createElement('button');
      b.textContent = STUDENTS[k].name;
      b.addEventListener('click', function () { chooseStudent(k); });
      list.appendChild(b);
    })(keys[i]);
  }
}

function paintStart() {
  if (!me) return;
  applyHomeScreenIdentity(studentKey);
  el('greeting').textContent = 'Hi ' + me.name + '!';
  el('startBlurb').innerHTML =
    (me.focus === ''
      ? me.problemsPerSession + ' multiplication facts<br>' +
        me.minFactor + ' through ' + me.maxFactor
      : '<b>The ' + me.focus + 's</b><br>' +
        me.problemsPerSession + ' problems, ' + me.focus + '&times;' + me.minFactor +
        ' to ' + me.focus + '&times;' + me.maxFactor) +
    ' &middot; ' + me.secondsPerProblem + ' seconds each';
  el('counter').textContent = '1 / ' + me.problemsPerSession;
  el('ringNum').textContent = String(me.secondsPerProblem);
  el('switchBtn').hidden = (Object.keys(STUDENTS).length < 2);

  var list = historyFor(histKey(studentKey, me.focus));
  var rec = el('record');
  if (!list.length) {
    rec.textContent = me.focus === ''
      ? 'First round — good luck!'
      : 'First time on the ' + me.focus + 's — good luck!';
  } else {
    var last = list[list.length - 1];
    var best = bestOf(list);
    rec.innerHTML =
      'Last time <b>' + last.s + '/' + last.n + '</b>' +
      ' &middot; Best <b>' + best.s + '/' + best.n + '</b>' +
      (best.s === best.n && pace(best) !== null ? ' in <b>' + mmss(best.a) + '</b>' : '') +
      (last.s < last.n ? '<br><span class="beat">Can you beat ' + last.s + '?</span>' : '');
  }
}

/* ---------------------- problem generation --------------------- */
/* Purely random. Misses are logged for the dashboard, never re-asked. */

function shuffled(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/**
 * One table, e.g. 12: every fact from 12×min to 12×max, shuffled, with the
 * orientation flipped at random so both 12×9 and 9×12 turn up. Dealt from a
 * reshuffled deck rather than picked at random, so a session covers the whole
 * table evenly instead of repeating some facts and skipping others.
 */
function makeFocusProblems(n, focus) {
  var pool = [];
  for (var v = me.minFactor; v <= me.maxFactor; v++) pool.push(v);
  if (!pool.length) pool = [focus];

  var out = [];
  var deck = [];
  var prevKey = '';

  while (out.length < n) {
    if (!deck.length) deck = shuffled(pool);
    var other = deck.pop();
    var flip = Math.random() < 0.5;
    var a = flip ? focus : other;
    var b = flip ? other : focus;

    // Only possible across a deck boundary, and only worth one retry.
    if (a + 'x' + b === prevKey && deck.length) {
      deck.unshift(other);
      other = deck.pop();
      a = flip ? focus : other;
      b = flip ? other : focus;
    }

    prevKey = a + 'x' + b;
    out.push({ a: a, b: b });
  }
  return out;
}

function makeProblems(n) {
  var focus = Number(me.focus);
  if (isFinite(focus) && focus > 0) return makeFocusProblems(n, focus);

  var out = [];
  var prevKey = '';
  for (var i = 0; i < n; i++) {
    var a, b, key, guard = 0;
    do {
      a = randInt(me.minFactor, me.maxFactor);
      b = randInt(me.minFactor, me.maxFactor);
      key = a + 'x' + b;
      guard++;
    } while (CONFIG.AVOID_IMMEDIATE_REPEAT && key === prevKey && guard < 25);
    prevKey = key;
    out.push({ a: a, b: b });
  }
  return out;
}

/* ----------------------------- play ---------------------------- */

function startSession() {
  if (!me) { show('screen-pick'); return; }
  wakeAudio();          // this call is inside the tap, which iOS requires
  S = {
    problems: makeProblems(me.problemsPerSession),
    seconds: me.secondsPerProblem,          // frozen for the whole session
    focus: me.focus,                        // ditto — recorded with the result
    index: 0,
    score: 0,
    missed: [],
    typed: '',
    deadline: 0,
    shownAt: 0,
    answerMs: 0,                            // time spent answering, pauses excluded
    startedAt: Date.now()
  };
  inSession = true;
  requestWakeLock();
  show('screen-play');
  nextProblem();
}

function nextProblem() {
  if (S.index >= S.problems.length) { finishSession(); return; }

  var p = S.problems[S.index];
  S.typed = '';

  el('counter').textContent = (S.index + 1) + ' / ' + S.problems.length;
  el('scorePill').textContent = S.score;
  el('progressBar').style.width = ((S.index / S.problems.length) * 100) + '%';
  el('problem').innerHTML = p.a + ' &times; ' + p.b;
  el('answer').textContent = '';
  el('answer').className = 'answer';
  el('verdict').textContent = '';
  el('verdict').className = 'verdict';

  S.shownAt = performance.now();
  S.deadline = S.shownAt + S.seconds * 1000;
  acceptingInput = true;
  tick();
}

function tick() {
  var left = S.deadline - performance.now();
  var span = S.seconds * 1000;
  var frac = Math.max(0, Math.min(1, left / span));

  var arc = el('ringArc');
  arc.setAttribute('stroke-dashoffset', String(RING_C * (1 - frac)));
  arc.setAttribute('stroke', frac > 0.5 ? '#4f9cff' : (frac > 0.25 ? '#f7b955' : '#f96a6a'));
  el('ringNum').textContent = String(Math.max(0, Math.ceil(left / 1000)));

  if (left <= 0) { resolveAnswer(true); return; }
  rafId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

function press(k) {
  if (!acceptingInput) return;

  if (k === 'del') {
    S.typed = S.typed.slice(0, -1);
  } else if (k === 'go') {
    if (S.typed === '') return;
    resolveAnswer(false);
    return;
  } else if (S.typed.length < CONFIG.MAX_ANSWER_DIGITS) {
    if (S.typed === '0') S.typed = '';         // no leading zeros
    S.typed += k;
  }
  el('answer').textContent = S.typed;
}

function resolveAnswer(timedOut) {
  if (!acceptingInput) return;
  acceptingInput = false;
  stopTimer();

  // Only the time this problem was on screen counts; the "Yes!" and the red
  // correction pauses do not, or misses would make the speed look slower.
  S.answerMs += Math.min(performance.now() - S.shownAt, S.seconds * 1000);

  var p = S.problems[S.index];
  var correct = p.a * p.b;
  // Keep what was typed even on a timeout: "had 56 but never pressed the
  // check" is a very different miss from a blank. It still counts as a miss.
  var given = S.typed;
  var isRight = !timedOut && Number(given) === correct;

  if (isRight) {
    S.score++;
    playCorrect();
    el('answer').textContent = given;
    el('answer').className = 'answer ok';
    el('verdict').textContent = 'Yes!';
    el('verdict').className = 'verdict ok';
  } else {
    playWrong();
    S.missed.push({ a: p.a, b: p.b, given: given, timeout: !!timedOut });
    el('answer').textContent = (timedOut && given === '') ? '—' : given;
    el('answer').className = 'answer no';
    el('verdict').textContent = CONFIG.SHOW_CORRECT_ON_MISS
      ? (p.a + ' × ' + p.b + ' = ' + correct)
      : (timedOut ? 'Out of time' : 'Not quite');
    if (timedOut && given !== '' && CONFIG.SHOW_CORRECT_ON_MISS) {
      el('verdict').textContent = 'Out of time — ' + p.a + ' × ' + p.b + ' = ' + correct;
    }
    el('verdict').className = 'verdict no';
  }

  el('scorePill').textContent = S.score;
  S.index++;

  setTimeout(nextProblem, isRight ? CONFIG.FEEDBACK_MS_CORRECT : CONFIG.FEEDBACK_MS_WRONG);
}

/* ---------------------------- finish --------------------------- */

function finishSession() {
  stopTimer();
  releaseWakeLock();
  inSession = false;
  playFinish();

  // Answering time only. Wall-clock time also counted every feedback pause
  // (0.45s per right answer, 1.7s per miss), which inflated seconds-per-problem
  // and made it rise with every miss.
  var elapsed = S.answerMs / 1000;
  var total = S.problems.length;
  var acc = total ? Math.round((100 * S.score) / total) : 0;

  // Read the record BEFORE this round joins it, and keep each mode's record
  // separate so a drilled table cannot set the mixed-round best.
  var hk = histKey(studentKey, S.focus);
  var past = historyFor(hk);
  var prevBest = bestOf(past);
  var prevLast = past.length ? past[past.length - 1] : null;
  var entry = { t: Date.now(), s: S.score, n: total, e: Math.round(elapsed),
                a: Math.round(elapsed * 10) / 10 };     // a: answering time, for pace()
  pushHistory(hk, entry);

  var perfect = total > 0 && S.score === total;
  var cmp = el('compare');
  cmp.className = 'compare';
  if (prevBest && (S.score / total) > (prevBest.s / prevBest.n)) {
    cmp.className = 'compare best';
    cmp.textContent = perfect
      ? '🏆 Perfect — a new best! Beat ' + prevBest.s + '/' + prevBest.n
      : '🏆 New best! Beat ' + prevBest.s + '/' + prevBest.n;
  } else if (prevBest && (S.score / total) === (prevBest.s / prevBest.n) && fasterThan(entry, prevBest)) {
    // Same score as the best, but quicker: that is a record too.
    cmp.className = 'compare best';
    cmp.textContent = (perfect ? '🏆 Perfect again, and your fastest yet! ' : '🏆 Your fastest ' +
      S.score + '/' + total + ' yet! ') + mmss(elapsed) + ', was ' + mmss(prevBest.a);
  } else if (perfect && prevLast && prevLast.s === prevLast.n) {
    cmp.className = 'compare up';
    cmp.textContent = 'Perfect again! 🎉';
  } else if (perfect) {
    cmp.className = 'compare up';
    cmp.textContent = prevLast ? 'Perfect round! 🎉' : 'Perfect first round! 🎉';
  } else if (prevLast) {
    var lastTxt = '(' + prevLast.s + '/' + prevLast.n + ')';
    // Same length round: compare scores. Different length (the dashboard
    // changed the problem count): only percentages are comparable.
    var sameLen = prevLast.n === total;
    var diff = sameLen ? S.score - prevLast.s : (S.score / total) - (prevLast.s / prevLast.n);
    if (Math.abs(diff) < 1e-9) {
      cmp.textContent = 'Same as last time ' + lastTxt;
    } else if (diff > 0) {
      cmp.className = 'compare up';
      cmp.textContent = sameLen
        ? '+' + diff + ' better than last time ' + lastTxt
        : 'Better than last time ' + lastTxt;
    } else {
      cmp.textContent = 'Last time ' + prevLast.s + '/' + prevLast.n;
    }
  } else {
    cmp.textContent = 'First round done!';
  }

  el('finalScore').textContent = S.score;
  el('finalOf').textContent = 'out of ' + total;
  el('statAcc').textContent = acc + '%';
  el('statTime').textContent = mmss(elapsed);
  el('statAvg').textContent = (total ? (elapsed / total).toFixed(1) : '0') + 's';

  var list = el('missedList');
  list.innerHTML = '';

  if (S.missed.length === 0) {
    el('missedHeading').textContent = 'Missed facts';
    list.innerHTML = '<div class="perfect">Perfect round — nothing missed. 🎉</div>';
  } else {
    el('missedHeading').textContent = 'Missed facts (' + S.missed.length + ')';
    for (var i = 0; i < S.missed.length; i++) {
      var m = S.missed[i];
      var said = m.timeout
        ? (m.given === '' ? 'ran out of time'
           : (Number(m.given) === m.a * m.b
              ? 'had <b class="had">' + esc(m.given) + '</b> but did not press ✓'
              : 'typed <b>' + esc(m.given) + '</b>, ran out of time'))
        : (m.given === '' ? 'left blank' : 'you said <b>' + esc(m.given) + '</b>');
      var row = document.createElement('div');
      row.className = 'miss';
      row.innerHTML =
        '<div class="fact">' + m.a + ' × ' + m.b + ' = ' + (m.a * m.b) + '</div>' +
        '<div class="said">' + said + '</div>';
      list.appendChild(row);
    }
  }

  show('screen-done');

  deliver({
    studentKey: studentKey,
    student: me.name,
    timestamp: new Date().toISOString(),
    score: S.score,
    total: total,
    elapsedSeconds: Math.round(elapsed * 10) / 10,
    mode: S.focus === '' ? '' : S.focus,
    missed: S.missed
  }, false);

  refreshSettings();     // pick up any dashboard change for the next round
}

/* ------------------------ sending the result ------------------- */

function setStatus(kind, html) {
  var box = el('sendStatus');
  box.className = 'status ' + kind;
  box.innerHTML = html;
  el('retryBtn').hidden = (kind !== 'failed');
}

/**
 * A refusal the server will repeat however often it is asked (unknown kid,
 * malformed session). Newer scripts flag it; for an older deployment, match
 * the validation messages it is known to send.
 */
function isPermanentRejection(data) {
  if (!data || data.ok) return false;
  if (data.permanent) return true;
  return /^(unknown student|missing student|bad (total|score|elapsedSeconds)|payload must)/
    .test(String(data.error || ''));
}

/**
 * Resolves with the server's reply. Rejects with err.rejected (the server
 * answered, but no) and err.permanent (and will never say yes), or a plain
 * network/timeout error. onSlow fires once if no reply within SEND_TIMEOUT_MS;
 * the request itself keeps going until SEND_GIVE_UP_MS.
 */
function postJson(payload, onSlow) {
  // text/plain keeps this a "simple" cross-origin request, so the browser
  // sends no OPTIONS preflight — an Apps Script web app cannot answer one.
  var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var giveUp = controller
    ? setTimeout(function () { controller.abort(); }, CONFIG.SEND_GIVE_UP_MS)
    : null;
  var slow = onSlow ? setTimeout(onSlow, CONFIG.SEND_TIMEOUT_MS) : null;
  function clear() { if (giveUp) clearTimeout(giveUp); if (slow) clearTimeout(slow); }

  var opts = {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  };
  if (controller) opts.signal = controller.signal;

  return fetch(CONFIG.SCRIPT_URL, opts)
    .then(function (res) { return res.json(); })
    .then(function (data) {
      clear();
      if (!data || !data.ok) {
        var err = new Error((data && data.error) || 'rejected');
        err.rejected = true;
        err.permanent = isPermanentRejection(data);
        throw err;
      }
      return data;
    }, function (err) {
      clear();
      if (err && err.name === 'AbortError') err = new Error('no reply after ' +
        Math.round(CONFIG.SEND_GIVE_UP_MS / 1000) + 's');
      throw err;
    });
}

var sending = {};                 // timestamp -> true while a POST is in flight
var onScreen = '';                // timestamp of the score the status box is about

function deliver(payload, isRetry) {
  if (!urlLooksSet()) {
    queuePending(payload);
    setStatus('failed',
      'This app has no upload address set up yet.<br><b>Show this screen to a parent.</b>');
    return;
  }

  onScreen = payload.timestamp;
  setStatus('sending', isRetry ? 'Trying again…' : 'Sending your score…');
  sending[payload.timestamp] = true;
  // A slow reply can land after the kid has finished another round; it must
  // not overwrite that round's status.
  function status(kind, html) { if (onScreen === payload.timestamp) setStatus(kind, html); }

  // The score is usually stored within a second; it is the notification after
  // it that can hang for ~50s. So a slow reply is not a failure yet.
  postJson(payload, function () {
    status('sending', 'Still sending… this can take up to a minute. ' +
      'You can start another round.');
  }).then(function () {
    delete sending[payload.timestamp];
    dropPending(payload.timestamp);
    status('sent', 'Score sent to your parent. ✅');
    flushPending();
  }).catch(function (err) {
    delete sending[payload.timestamp];
    var why = (err && err.message) ? String(err.message).slice(0, 80) : 'no reply';

    if (err && err.permanent) {
      // Resending will never work, so do not queue it where it would block
      // every later score. Keep a copy aside so it is not simply lost.
      dropPending(payload.timestamp);
      parkRejected(payload, why);
      status('failed',
        'Your score could not be saved.<br><b>Show this screen to a parent.</b>' +
        '<span class="why">' + esc(payload.studentKey + ': ' + why) + '</span>');
      return;
    }

    queuePending(payload);
    status('failed',
      'Could not send your score right now.<br><b>Show this screen to a parent</b> ' +
      'before you close it. It will send itself next time you open the app on wifi.' +
      '<span class="why">' + esc(payload.studentKey + ': ' + why) + '</span>');
  });
}

/* --------- offline queue: nothing is lost if the POST fails ----- */

function readPending() {
  try {
    var raw = localStorage.getItem(PENDING_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function writePending(arr) {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(arr.slice(-30))); } catch (e) {}
}

function queuePending(payload) {
  var arr = readPending();
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].timestamp === payload.timestamp) return;
  }
  arr.push(payload);
  writePending(arr);
  showPendingNote();
}

function dropPending(timestamp) {
  writePending(readPending().filter(function (p) { return p.timestamp !== timestamp; }));
  showPendingNote();
}

/** Out of the queue for good, but kept on the phone in case it matters. */
function parkRejected(payload, why) {
  try {
    var raw = localStorage.getItem(REJECTED_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) arr = [];
    arr.push({ payload: payload, error: why, at: new Date().toISOString() });
    localStorage.setItem(REJECTED_KEY, JSON.stringify(arr.slice(-30)));
  } catch (e) {}
}

var flushing = false;

/**
 * Send every queued score, oldest first. A network failure stops the run
 * (the rest would fail too). A refusal does NOT: a permanent one is set
 * aside, any other is skipped for now — either way the scores behind it
 * still go. It used to stop at the first failure of any kind, so one score
 * the server would never accept blocked everything queued after it.
 */
function flushPending() {
  if (!urlLooksSet() || flushing) { showPendingNote(); return; }
  var arr = readPending().filter(function (p) { return !sending[p.timestamp]; });
  if (!arr.length) { showPendingNote(); return; }

  flushing = true;
  var i = 0;
  (function next() {
    if (i >= arr.length) { flushing = false; showPendingNote(); return; }
    var item = arr[i++];
    postJson(item).then(function () {
      dropPending(item.timestamp);
      next();
    }).catch(function (err) {
      if (err && err.permanent) {
        dropPending(item.timestamp);
        parkRejected(item, err.message);
        next();
      } else if (err && err.rejected) {
        next();
      } else {
        flushing = false;
        showPendingNote();
      }
    });
  })();
}

function showPendingNote() {
  var n = readPending().length;
  var note = el('pendingNote');
  note.hidden = (n === 0);
  note.textContent = n
    ? (n + ' finished score' + (n > 1 ? 's' : '') + ' still waiting to send. ' +
       'They will go out on their own once you are on wifi.')
    : '';
}

/* ---------------------------- wake lock ------------------------ */

function requestWakeLock() {
  if (!CONFIG.KEEP_SCREEN_AWAKE || !navigator.wakeLock) return;
  if (wakeLock && !wakeLock.released) return;
  navigator.wakeLock.request('screen')
    .then(function (l) { wakeLock = l; })
    .catch(function () {});
}

function releaseWakeLock() {
  if (wakeLock) {
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
}

/* ------------------------------ wiring ------------------------- */

el('pad').addEventListener('click', function (ev) {
  var btn = ev.target.closest('button[data-k]');
  if (btn) press(btn.getAttribute('data-k'));
});

document.addEventListener('keydown', function (ev) {
  if (!acceptingInput) return;
  var k = (ev.key >= '0' && ev.key <= '9' && ev.key.length === 1) ? ev.key
        : ev.key === 'Backspace' ? 'del'
        : ev.key === 'Enter' ? 'go' : '';
  if (!k) return;
  // Otherwise Enter also "clicks" whichever keypad button has focus.
  ev.preventDefault();
  press(k);
});

el('startBtn').addEventListener('click', startSession);
el('againBtn').addEventListener('click', startSession);
el('soundBtn').addEventListener('click', function () { setSoundOn(!soundOn()); });
el('switchBtn').addEventListener('click', function () { paintPicker(); show('screen-pick'); });
el('retryBtn').addEventListener('click', function () {
  var arr = readPending();
  if (arr.length) deliver(arr[arr.length - 1], true);
});

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  wakeAudio();            // iOS suspends the context while backgrounded
  if (inSession) {
    // The browser drops the screen wake lock whenever the page is hidden and
    // never gives it back on its own.
    requestWakeLock();
  } else {
    flushPending();
    refreshSettings();
  }
});

(function init() {
  el('ver').textContent = APP_VERSION;
  paintSoundBtn();
  loadSettings();
  paintPicker();

  // The URL wins; the remembered kid is the safety net for when iOS has
  // stripped ?student= off a home-screen launch.
  var wanted = studentFromUrl() || lastStudent();
  var keys = Object.keys(STUDENTS);

  if (wanted && STUDENTS[wanted]) {
    chooseStudent(wanted);
  } else if (keys.length === 1) {
    chooseStudent(keys[0]);
  } else {
    show('screen-pick');
  }

  showPendingNote();
  flushPending();
  refreshSettings();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
