<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-title" content="Math Dash">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Math Facts — Parent Dashboard</title>

<!-- Setup lives in config.js. Practice settings live in the Sheet and are
     edited at the bottom of this page. -->
<script src="config.js"></script>

<style>
  :root{
    --bg:#0b1220; --card:#161f36; --ink:#f3f6ff; --muted:#9fb0d0;
    --accent:#4f9cff; --good:#31c48d; --bad:#f96a6a; --warn:#f7b955; --line:#28345a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:max(16px,env(safe-area-inset-top)) 14px 48px;
    max-width:640px;margin:0 auto;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
  h1{font-size:22px;margin:0;font-weight:800}
  .refresh{
    border:0;border-radius:10px;background:var(--card);color:var(--ink);
    font-size:13px;font-weight:700;padding:8px 14px;
  }
  .updated{font-size:12px;color:var(--muted);margin-bottom:14px}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{
    border:0;border-radius:999px;background:var(--card);color:var(--muted);
    font-size:15px;font-weight:700;padding:10px 20px;
  }
  .tabs button.on{background:var(--accent);color:#04121f}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--muted);margin:26px 0 10px;font-weight:800}

  /* Collapsible sections. <details> so it works without JS; the open/closed
     choice is remembered per section on this device. */
  details.sec{margin:22px 0 0}
  details.sec > summary{
    list-style:none;cursor:pointer;user-select:none;
    font-size:13px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:800;padding:6px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  details.sec > summary::-webkit-details-marker{display:none}
  details.sec > summary::before{
    content:'';width:0;height:0;flex:none;
    border-left:5px solid var(--muted);border-top:4px solid transparent;
    border-bottom:4px solid transparent;transition:transform .15s;
  }
  details.sec[open] > summary::before{transform:rotate(90deg)}
  details.sec > summary:hover{color:var(--ink)}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:var(--card);border-radius:16px;padding:14px}
  .tile b{display:block;font-size:26px;font-weight:800;line-height:1.15}
  .tile span{font-size:12px;color:var(--muted)}
  .tile .delta{font-size:12px;font-weight:700}
  .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}

  .panel{background:var(--card);border-radius:16px;padding:14px 12px 8px}
  .panel .cap{font-size:12px;color:var(--muted);padding:0 4px 6px}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}

  .trouble{background:var(--card);border-radius:16px;padding:4px 14px}
  .trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:0}
  .trow .fact{font-size:20px;font-weight:800;min-width:78px;white-space:nowrap}
  .trow .meta{flex:1;font-size:13px;color:var(--muted);line-height:1.45}
  .trow .meta em{font-style:normal;color:var(--ink);font-weight:700}
  .heat{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
  .heat.hot{background:#43191b;color:#ffb3b3}
  .heat.warm{background:#3d3418;color:#ffdf9e}

  .session{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .session .when{flex:1;font-size:14px}
  .session .when small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
  .badge{font-size:15px;font-weight:800;padding:7px 12px;border-radius:12px;white-space:nowrap}
  .badge.a{background:#11331f;color:#8ff0c4}
  .badge.b{background:#33301199;color:#ffe08a}
  .badge.c{background:#3a1c1c;color:#ffc9c9}

  /* ---- settings editor ---- */
  .settings{background:var(--card);border-radius:16px;padding:16px}
  .field{display:flex;align-items:center;justify-content:space-between;gap:12px;
         padding:11px 0;border-bottom:1px solid var(--line)}
  .field:last-of-type{border-bottom:0}
  .field label{font-size:15px;flex:1}
  .field label small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .field input{
    width:104px;flex:none;background:#0d1424;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px;font-size:17px;font-weight:700;text-align:center;
    font-family:inherit;
  }
  .field input[type=text]{width:130px;text-align:left;font-weight:600}
  .field select{
    width:130px;flex:none;background:#0d1424;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px;font-size:15px;font-weight:700;font-family:inherit;
  }
  .session .when small b.mode{color:#a78bfa;font-weight:800}
  .field input:focus{outline:2px solid var(--accent);border-color:transparent}
  .save{
    margin-top:14px;width:100%;border:0;border-radius:14px;padding:15px;
    font-size:17px;font-weight:800;background:var(--accent);color:#04121f;
  }
  .save:disabled{opacity:.55}
  .saveMsg{margin-top:10px;font-size:13px;line-height:1.5;min-height:18px}
  .saveMsg.ok{color:var(--good)} .saveMsg.bad{color:var(--bad)}
  .link{
    margin-top:14px;background:#0d1424;border-radius:12px;padding:12px;
    font-size:12px;color:var(--muted);line-height:1.6;word-break:break-all;
  }
  .link b{color:var(--ink);font-weight:700}
  .link a{color:var(--accent);font-weight:600;text-decoration:none;word-break:break-all}
  .link a:hover{text-decoration:underline}
  .addkid{background:var(--card);border-radius:16px;padding:16px;border:1px dashed var(--line)}
  .addkid .intro{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:6px}
  .addkid .save{background:var(--good);color:#04211a}
  .sheetlink{margin-top:22px;text-align:center;font-size:14px}
  .sheetlink a{color:var(--accent);font-weight:700;text-decoration:none}
  .sheetlink small{display:block;margin-top:6px;color:var(--muted);font-size:11.5px;line-height:1.5}

  .empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;
         color:var(--muted);font-size:14px;line-height:1.55}
  .err{background:#3a1c1c;color:#ffc9c9;border-radius:16px;padding:16px;font-size:14px;line-height:1.55}
  code{background:#0006;padding:2px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1 id="title">Math Facts</h1>
  <button class="refresh" id="refreshBtn">Refresh</button>
</header>
<div class="updated" id="updated">Loading…</div>

<div class="tabs" id="tabs"></div>
<div id="content">
  <div class="empty">Loading sessions…</div>
</div>

<script>
/* ------------------------------------------------------------------
   Shared settings come from config.js. Each kid's practice settings
   come from the Sheet and are edited at the bottom of this page.
   ------------------------------------------------------------------ */
var DEFAULTS = {
  SCRIPT_URL: '',
  TROUBLE_WINDOW: 10,
  TROUBLE_MIN_SESSIONS: 2,
  TREAT_COMMUTATIVE_AS_SAME: true,
  TREND_SESSIONS: 20,
  RECENT_SESSIONS_SHOWN: 12,
  WEEKS_SHOWN: 8
};

var CONFIG = (function () {
  var out = {};
  var src = window.MATH_CONFIG || {};
  for (var k in DEFAULTS) {
    if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
      out[k] = (src[k] === undefined || src[k] === null || src[k] === '') ? DEFAULTS[k] : src[k];
    }
  }
  return out;
})();

var PIN_KEY = 'mathfacts_pin_v1';
var SEC_KEY = 'mathfacts_sec_v1_';

/** Remembered per section, per device, so the layout stays how you left it. */
function sectionOpen(id, dflt) {
  try {
    var v = localStorage.getItem(SEC_KEY + id);
    return v === null ? dflt : v === '1';
  } catch (e) { return dflt; }
}

function section(id, title, inner, defaultOpen) {
  return '<details class="sec" data-sec="' + esc(id) + '"' +
         (sectionOpen(id, defaultOpen !== false) ? ' open' : '') + '>' +
         '<summary>' + title + '</summary>' + inner + '</details>';
}

function wireSections() {
  var all = document.querySelectorAll('details.sec');
  for (var i = 0; i < all.length; i++) {
    (function (d) {
      d.addEventListener('toggle', function () {
        try { localStorage.setItem(SEC_KEY + d.getAttribute('data-sec'), d.open ? '1' : '0'); }
        catch (e) {}
      });
    })(all[i]);
  }
}

var ALL = [];          // every session, normalized, oldest first
var SETTINGS = {};     // key -> {name, minFactor, maxFactor, ...}
var ACTIVE = '';       // selected student key
var PIN_REQUIRED = false;
var STALE_SCRIPT = false;  // the deployed Apps Script predates the Settings tab
var SHEET_URL = '';        // handed over by the Apps Script, not stored in the repo

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function mmss(sec) {
  var t = Math.max(0, Math.round(Number(sec) || 0));
  return Math.floor(t / 60) + ':' + (t % 60 < 10 ? '0' : '') + (t % 60);
}
function pct(x) { return Math.round(x * 100) + '%'; }
function scriptSet() {
  return CONFIG.SCRIPT_URL && CONFIG.SCRIPT_URL.indexOf('http') === 0;
}

/* ------------------------------ load ---------------------------- */

function load() {
  el('updated').textContent = 'Loading…';

  if (!scriptSet()) {
    el('content').innerHTML =
      '<div class="err"><b>No data source configured.</b><br>' +
      'Open <code>config.js</code> in the repo and paste the Apps Script ' +
      'web app URL (the one ending in <code>/exec</code>) into ' +
      '<code>SCRIPT_URL</code>.</div>';
    el('updated').textContent = '';
    return;
  }

  var url = CONFIG.SCRIPT_URL + (CONFIG.SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') +
            'limit=400&t=' + Date.now();

  fetch(url, { method: 'GET' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error((data && data.error) || 'bad response');

      ALL = normalize(data.sessions || []);

      // An Apps Script older than v1.1.0 has no Settings tab and returns no
      // settings at all. Fall back to the config.js roster so every kid still
      // gets a tab, and say why the editor is unavailable rather than just
      // quietly dropping them.
      STALE_SCRIPT = !data.settings;
      SETTINGS = data.settings || {};
      if (!Object.keys(SETTINGS).length) SETTINGS = fallbackStudents();
      PIN_REQUIRED = !!data.pinRequired;
      SHEET_URL = data.spreadsheetUrl ||
                  (window.MATH_CONFIG && window.MATH_CONFIG.SHEET_URL) || '';

      var keys = studentKeys();
      if (!ACTIVE || keys.indexOf(ACTIVE) === -1) ACTIVE = keys[0] || '';

      renderTabs(keys);
      render();
      el('updated').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    })
    .catch(function (err) {
      el('content').innerHTML =
        '<div class="err"><b>Could not load the results.</b><br>' + esc(err.message) +
        '<br><br>Check that the Apps Script web app is deployed with access set to ' +
        '<b>Anyone</b>, and that <code>SCRIPT_URL</code> in <code>config.js</code> is the ' +
        '<code>/exec</code> address.</div>';
      el('updated').textContent = '';
    });
}

function normalize(rows) {
  var out = rows.map(function (r) {
    var when = new Date(r.timestamp || r.receivedAt);
    if (isNaN(when.getTime())) when = new Date(r.receivedAt);
    var total = Number(r.total) || 0;
    var elapsed = Number(r.elapsedSeconds) || 0;
    return {
      when: when,
      key: String(r.studentKey || r.student || '').toLowerCase(),
      student: r.student || '',
      score: Number(r.score) || 0,
      total: total,
      accuracy: total ? (Number(r.score) || 0) / total : 0,
      elapsed: elapsed,
      perProblem: total ? elapsed / total : 0,
      mode: (r.mode === null || r.mode === undefined || r.mode === '') ? '' : String(r.mode),
      missed: Array.isArray(r.missed) ? r.missed : []
    };
  }).filter(function (s) { return s.total > 0 && !isNaN(s.when.getTime()); });

  out.sort(function (a, b) { return a.when - b.when; });   // oldest first
  return out;
}

/** The roster from config.js, used when the Sheet has no Settings tab yet. */
function fallbackStudents() {
  var src = (window.MATH_CONFIG && window.MATH_CONFIG.STUDENTS) || {};
  var out = {};
  for (var k in src) {
    if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
    var key = String(k).toLowerCase();
    var s = src[k] || {};
    out[key] = {
      key: key,
      name: String(s.name || key),
      minFactor: Number(s.minFactor) || 1,
      maxFactor: Number(s.maxFactor) || 12,
      problemsPerSession: Number(s.problemsPerSession) || 20,
      secondsPerProblem: Number(s.secondsPerProblem) || 10,
      focus: (s.focus === undefined || s.focus === null) ? '' : s.focus
    };
  }
  return out;
}

/** Everyone in the settings, plus anyone who has sessions but no settings row. */
function studentKeys() {
  var keys = Object.keys(SETTINGS);
  ALL.forEach(function (s) {
    if (s.key && keys.indexOf(s.key) === -1) keys.push(s.key);
  });
  return keys;
}

function displayName(key) {
  if (SETTINGS[key] && SETTINGS[key].name) return SETTINGS[key].name;
  for (var i = ALL.length - 1; i >= 0; i--) if (ALL[i].key === key) return ALL[i].student;
  return key;
}

function sessionsFor(key) {
  return ALL.filter(function (s) { return s.key === key; });
}

function renderTabs(keys) {
  var box = el('tabs');
  box.innerHTML = '';
  if (keys.length < 2) return;
  keys.forEach(function (k) {
    var b = document.createElement('button');
    b.textContent = displayName(k);
    if (k === ACTIVE) b.className = 'on';
    b.addEventListener('click', function () {
      ACTIVE = k;
      renderTabs(keys);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    box.appendChild(b);
  });
}

/* ---------------------------- analytics ------------------------- */

function factKey(a, b) {
  a = Number(a); b = Number(b);
  if (CONFIG.TREAT_COMMUTATIVE_AS_SAME) {
    return Math.min(a, b) + '×' + Math.max(a, b);
  }
  return a + '×' + b;
}

function troubleFacts(sessions) {
  var window_ = sessions.slice(-CONFIG.TROUBLE_WINDOW);
  var map = {};

  window_.forEach(function (s) {
    var seenThisSession = {};
    s.missed.forEach(function (m) {
      var key = factKey(m.a, m.b);
      if (!map[key]) map[key] = { key: key, sessions: 0, misses: 0, answers: {}, timeouts: 0 };
      map[key].misses++;
      if (m.timeout) map[key].timeouts++;
      else if (m.given) map[key].answers[m.given] = (map[key].answers[m.given] || 0) + 1;
      if (!seenThisSession[key]) { map[key].sessions++; seenThisSession[key] = true; }
    });
  });

  var list = Object.keys(map).map(function (k) { return map[k]; });
  list.sort(function (x, y) {
    return (y.sessions - x.sessions) || (y.misses - x.misses) || x.key.localeCompare(y.key);
  });

  return {
    windowSize: window_.length,
    repeated: list.filter(function (f) { return f.sessions >= CONFIG.TROUBLE_MIN_SESSIONS; }),
    oneOffs: list.filter(function (f) { return f.sessions < CONFIG.TROUBLE_MIN_SESSIONS; })
  };
}

function weekStart(d) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = (x.getDay() + 6) % 7;          // Monday = 0
  x.setDate(x.getDate() - day);
  return x;
}

function weekBuckets(sessions, weeks) {
  var thisWeek = weekStart(new Date());
  var out = [];
  for (var i = weeks - 1; i >= 0; i--) {
    var start = new Date(thisWeek);
    start.setDate(start.getDate() - i * 7);
    out.push({ start: start, count: 0 });
  }
  sessions.forEach(function (s) {
    var ws = weekStart(s.when).getTime();
    for (var i = 0; i < out.length; i++) {
      if (out[i].start.getTime() === ws) { out[i].count++; break; }
    }
  });
  return out;
}

function avg(arr) {
  if (!arr.length) return 0;
  return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
}

/* ------------------------------ charts -------------------------- */

var W = 320, H = 132, PL = 30, PR = 10, PT = 12, PB = 22;

function lineChart(values, labels, opts) {
  opts = opts || {};
  if (values.length < 2) {
    return '<div class="cap" style="padding:14px 4px">Not enough sessions yet — ' +
           'this chart needs at least two.</div>';
  }

  var min = (opts.min !== undefined) ? opts.min : Math.min.apply(null, values);
  var max = (opts.max !== undefined) ? opts.max : Math.max.apply(null, values);
  if (max === min) { max = min + 1; }
  var pad = (max - min) * 0.12;
  min = (opts.min !== undefined) ? opts.min : min - pad;
  max = (opts.max !== undefined) ? opts.max : max + pad;

  var x = function (i) { return PL + (i * (W - PL - PR)) / (values.length - 1); };
  var y = function (v) { return PT + (1 - (v - min) / (max - min)) * (H - PT - PB); };

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';

  [0, 0.5, 1].forEach(function (f) {
    var v = min + f * (max - min);
    var yy = y(v);
    svg += '<line x1="' + PL + '" y1="' + yy + '" x2="' + (W - PR) + '" y2="' + yy +
           '" stroke="#28345a" stroke-width="1"/>';
    svg += '<text x="' + (PL - 5) + '" y="' + (yy + 3.5) +
           '" text-anchor="end" font-size="9" fill="#9fb0d0">' +
           esc(opts.fmt ? opts.fmt(v) : Math.round(v)) + '</text>';
  });

  var pts = values.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
  var color = opts.color || '#4f9cff';

  svg += '<polyline points="' + pts + '" fill="none" stroke="' + color +
         '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

  values.forEach(function (v, i) {
    svg += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="2.6" fill="' + color + '"/>';
  });

  if (labels && labels.length) {
    [0, values.length - 1].forEach(function (i, n) {
      svg += '<text x="' + x(i) + '" y="' + (H - 5) + '" font-size="9" fill="#9fb0d0" ' +
             'text-anchor="' + (n === 0 ? 'start' : 'end') + '">' + esc(labels[i]) + '</text>';
    });
  }

  return svg + '</svg>';
}

function barChart(items) {
  var max = Math.max(1, Math.max.apply(null, items.map(function (i) { return i.count; })));
  var n = items.length;
  var slot = (W - PL - PR) / n;
  var bw = Math.min(26, slot * 0.6);

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  svg += '<line x1="' + PL + '" y1="' + (H - PB) + '" x2="' + (W - PR) + '" y2="' + (H - PB) +
         '" stroke="#28345a" stroke-width="1"/>';
  svg += '<text x="' + (PL - 5) + '" y="' + (PT + 4) +
         '" text-anchor="end" font-size="9" fill="#9fb0d0">' + max + '</text>';

  items.forEach(function (it, i) {
    var cx = PL + slot * i + slot / 2;
    var h = (it.count / max) * (H - PT - PB);
    var yy = (H - PB) - h;
    svg += '<rect x="' + (cx - bw / 2) + '" y="' + yy + '" width="' + bw + '" height="' +
           Math.max(h, it.count ? 2 : 0) + '" rx="3" fill="' +
           (i === n - 1 ? '#4f9cff' : '#33487a') + '"/>';
    if (it.count) {
      svg += '<text x="' + cx + '" y="' + (yy - 3) + '" font-size="9" fill="#f3f6ff" ' +
             'text-anchor="middle" font-weight="700">' + it.count + '</text>';
    }
    svg += '<text x="' + cx + '" y="' + (H - 6) + '" font-size="8.5" fill="#9fb0d0" ' +
           'text-anchor="middle">' + (it.start.getMonth() + 1) + '/' + it.start.getDate() +
           '</text>';
  });

  return svg + '</svg>';
}

/* --------------------------- settings card ---------------------- */

function settingsCard(key) {
  var s = SETTINGS[key];
  if (!s) {
    return '<div class="empty">' + esc(displayName(key)) +
           ' has sessions but no settings row in the Sheet yet.</div>';
  }

  var quizUrl = location.origin + location.pathname.replace(/dashboard\.html$/, '') +
                '?student=' + encodeURIComponent(key);

  if (STALE_SCRIPT) {
    return '<div class="err"><b>The settings editor needs a newer Apps Script.</b><br>' +
           'The one deployed right now is from v1.0.0 — it has no <code>Settings</code> ' +
           'tab, so it cannot store changes, it only accepts sessions for one child, ' +
           'and it cannot tell the kids apart.<br><br>' +
           'Fix: open the Sheet &rarr; <b>Extensions &rarr; Apps Script</b>, replace the ' +
           'code with the current <code>apps-script/Code.gs</code> from the repo, then ' +
           '<b>Deploy &rarr; Manage deployments &rarr; pencil &rarr; Version: New version ' +
           '&rarr; Deploy</b>. Reload this page afterwards.<br><br>' +
           'Meanwhile ' + esc(s.name) + ' practices ' + s.minFactor + '&ndash;' +
           s.maxFactor + ' at ' + s.secondsPerProblem + 's, from <code>config.js</code>.' +
           '</div>' +
           '<div class="link" style="margin-top:10px"><b>' + esc(s.name) +
           '&rsquo;s quiz link</b><br><a href="' + esc(quizUrl) + '" target="_blank" ' +
           'rel="noopener">' + esc(quizUrl) + '</a></div>';
  }

  var html = '<div class="settings">';

  html += field_('setName', 'Name', 'shown on the quiz screen', s.name, 'text');
  html += field_('setSeconds', 'Seconds per problem',
                 'how long before it counts as a miss', s.secondsPerProblem, 'number', 3, 60);
  html += field_('setMin', 'Smallest number', 'e.g. 3 skips all the ×2 facts',
                 s.minFactor, 'number', 1, 20);
  html += field_('setMax', 'Largest number', '', s.maxFactor, 'number', 1, 20);
  html += field_('setProblems', 'Problems per session', '', s.problemsPerSession, 'number', 5, 100);

  var opts = '<option value=""' + (s.focus === '' ? ' selected' : '') + '>Mix</option>';
  for (var v = s.minFactor; v <= s.maxFactor; v++) {
    opts += '<option value="' + v + '"' + (Number(s.focus) === v ? ' selected' : '') +
            '>the ' + v + 's</option>';
  }
  html += '<div class="field"><label for="setFocus">Practice<small>Mix is every fact ' +
          'in the range. A single table is easier — good for learning a new one, ' +
          'not for measuring.</small></label>' +
          '<select id="setFocus">' + opts + '</select></div>';

  if (PIN_REQUIRED) {
    html += field_('setPin', 'Parent PIN', 'required to save changes',
                   localStorage.getItem(PIN_KEY) || '', 'text');
  }

  html += '<button class="save" id="saveBtn">Save ' + esc(s.name) + '&rsquo;s settings</button>';
  html += '<div class="saveMsg" id="saveMsg"></div>';
  html += '<div class="link"><b>' + esc(s.name) + '&rsquo;s quiz link</b><br>' +
          '<a href="' + esc(quizUrl) + '" target="_blank" rel="noopener">' +
          esc(quizUrl) + '</a></div>';
  html += '</div>';
  return html;
}

/**
 * Adding a kid used to mean editing config.js, DEFAULT_STUDENTS in the Apps
 * Script, a manifest and sw.js, then redeploying — and getting any one of them
 * wrong produced a kid who appeared in the quiz picker and then had every
 * session refused. Writing straight to the Settings tab is the whole job: the
 * quiz reads its roster from there, so they show up on the next app open.
 */
function addKidCard() {
  var html = '<div class="addkid">' +
    '<div class="intro">They appear on their phone the next time the app opens. ' +
    'Nothing to install and no code to edit.</div>';

  html += field_('newName', 'Name', 'e.g. Sam', '', 'text');
  html += field_('newSeconds', 'Seconds per problem', '', 12, 'number', 3, 60);
  html += field_('newMin', 'Smallest number', 'e.g. 3 skips every ×2 fact', 2, 'number', 1, 20);
  html += field_('newMax', 'Largest number', '', 12, 'number', 1, 20);
  html += field_('newProblems', 'Problems per session', '', 20, 'number', 5, 100);

  if (PIN_REQUIRED) {
    html += field_('newPin', 'Parent PIN', '', localStorage.getItem(PIN_KEY) || '', 'text');
  }

  html += '<button class="save" id="addBtn">Add</button>' +
          '<div class="saveMsg" id="addMsg"></div></div>';
  return html;
}

/** Escape hatch: the raw Sheet, for when you want to see or fix the data. */
function sheetLink() {
  if (!SHEET_URL) return '';
  return '<div class="sheetlink"><a href="' + esc(SHEET_URL) + '" target="_blank" ' +
         'rel="noopener">Open the results Sheet &nearr;</a>' +
         '<small>Opens in Google Sheets. You need to be signed in to the account ' +
         'that owns it.</small></div>';
}

/** 'Sam O.' -> 'sam'. Must match the key rule the Apps Script enforces. */
function keyFromName(name) {
  var key = String(name).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 20);
  return key;
}

function wireAddKid() {
  var btn = el('addBtn');
  if (!btn) return;

  btn.addEventListener('click', function () {
    var msg = el('addMsg');
    var name = el('newName').value.trim();
    var key = keyFromName(name);

    if (!name) { msg.className = 'saveMsg bad'; msg.textContent = 'Give them a name first.'; return; }
    if (!key) {
      msg.className = 'saveMsg bad';
      msg.textContent = 'That name has no letters or numbers to make an id from.';
      return;
    }
    if (SETTINGS[key]) {
      msg.className = 'saveMsg bad';
      msg.textContent = 'There is already a kid with the id "' + key + '".';
      return;
    }

    var body = {
      name: name,
      secondsPerProblem: Number(el('newSeconds').value),
      minFactor: Number(el('newMin').value),
      maxFactor: Number(el('newMax').value),
      problemsPerSession: Number(el('newProblems').value)
    };
    if (body.minFactor > body.maxFactor) {
      msg.className = 'saveMsg bad';
      msg.textContent = 'The smallest number has to be below the largest.';
      return;
    }

    var payload = { type: 'settings', students: {} };
    payload.students[key] = body;
    if (PIN_REQUIRED) {
      payload.pin = el('newPin').value.trim();
      try { localStorage.setItem(PIN_KEY, payload.pin); } catch (e) {}
    }

    btn.disabled = true;
    msg.className = 'saveMsg';
    msg.textContent = 'Adding…';

    fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (!data || !data.ok) throw new Error((data && data.error) || 'rejected');
        SETTINGS = data.settings || SETTINGS;
        ACTIVE = key;
        renderTabs(studentKeys());
        render();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      })
      .catch(function (err) {
        btn.disabled = false;
        msg.className = 'saveMsg bad';
        msg.textContent = 'Could not add them: ' + err.message;
      });
  });
}

function field_(id, label, hint, value, type, min, max) {
  return '<div class="field"><label for="' + id + '">' + esc(label) +
         (hint ? '<small>' + esc(hint) + '</small>' : '') + '</label>' +
         '<input id="' + id + '" type="' + type + '"' +
         (type === 'number' ? ' inputmode="numeric" min="' + min + '" max="' + max + '"' : '') +
         ' value="' + esc(value) + '"></div>';
}

function wireSettings(key) {
  var btn = el('saveBtn');
  if (!btn) return;

  btn.addEventListener('click', function () {
    var msg = el('saveMsg');
    var body = {
      name: el('setName').value.trim(),
      secondsPerProblem: Number(el('setSeconds').value),
      minFactor: Number(el('setMin').value),
      maxFactor: Number(el('setMax').value),
      problemsPerSession: Number(el('setProblems').value),
      focus: el('setFocus') ? el('setFocus').value : ''
    };

    if (!body.name) { msg.className = 'saveMsg bad'; msg.textContent = 'Name cannot be empty.'; return; }
    if (body.minFactor > body.maxFactor) {
      msg.className = 'saveMsg bad';
      msg.textContent = 'The smallest number has to be below the largest.';
      return;
    }

    var payload = { type: 'settings', students: {} };
    payload.students[key] = body;
    if (PIN_REQUIRED) {
      payload.pin = el('setPin').value.trim();
      try { localStorage.setItem(PIN_KEY, payload.pin); } catch (e) {}
    }

    btn.disabled = true;
    msg.className = 'saveMsg';
    msg.textContent = 'Saving…';

    fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (!data || !data.ok) throw new Error((data && data.error) || 'rejected');
        SETTINGS = data.settings || SETTINGS;
        msg.className = 'saveMsg ok';
        msg.textContent = 'Saved. It applies on ' + displayName(key) +
                          '’s next round — the app picks it up next time it opens.';
        renderTabs(studentKeys());
      })
      .catch(function (err) {
        btn.disabled = false;
        msg.className = 'saveMsg bad';
        msg.textContent = 'Could not save: ' + err.message;
      });
  });
}

/* ------------------------------ render -------------------------- */

function render() {
  var key = ACTIVE;
  var sessions = sessionsFor(key);
  el('title').textContent = displayName(key) || 'Math Facts';

  var html = '';

  if (STALE_SCRIPT) {
    html += '<div class="err" style="margin-bottom:16px">' +
            '<b>Your Apps Script is out of date.</b> It is not storing which child a ' +
            'session belongs to, so every round shows up under one name and the ' +
            'settings editor is disabled. See the bottom of this page for the fix.' +
            '</div>';
  }

  if (!sessions.length) {
    html += '<div class="empty">No sessions logged for ' + esc(displayName(key)) + ' yet.' +
            '<br><br>Once a round is finished on the quiz app, it shows up here.</div>';
    html += section('settings', esc(displayName(key)) + '&rsquo;s settings', settingsCard(key));
    if (!STALE_SCRIPT) html += section('addkid', 'Add a kid', addKidCard(), false);
    html += sheetLink();
    el('content').innerHTML = html;
    wireSettings(key);
    wireAddKid();
    wireSections();
    return;
  }

  var recent5 = sessions.slice(-5);
  var prev5 = sessions.slice(-10, -5);

  var weeks = weekBuckets(sessions, CONFIG.WEEKS_SHOWN);
  var thisWeekCount = weeks[weeks.length - 1].count;

  var accNow = avg(recent5.map(function (s) { return s.accuracy; }));
  var accWas = avg(prev5.map(function (s) { return s.accuracy; }));
  var spdNow = avg(recent5.map(function (s) { return s.perProblem; }));
  var spdWas = avg(prev5.map(function (s) { return s.perProblem; }));

  function delta(now, was, betterIsUp, fmt) {
    if (!prev5.length) return '<span class="delta flat">no earlier runs yet</span>';
    var diff = now - was;
    if (Math.abs(diff) < 1e-9) return '<span class="delta flat">no change</span>';
    var better = betterIsUp ? diff > 0 : diff < 0;
    var arrow = diff > 0 ? '▲' : '▼';
    return '<span class="delta ' + (better ? 'up' : 'down') + '">' + arrow + ' ' +
           fmt(Math.abs(diff)) + ' vs. the 5 before</span>';
  }

  /* ---- tiles ---- */
  html += '<div class="tiles">';
  html += '<div class="tile"><b>' + sessions.length + '</b><span>sessions logged</span></div>';
  html += '<div class="tile"><b>' + thisWeekCount + '</b><span>this week</span></div>';
  html += '<div class="tile"><b>' + pct(accNow) + '</b><span>accuracy, last 5</span>' +
          delta(accNow, accWas, true, function (d) { return Math.round(d * 100) + ' pts'; }) +
          '</div>';
  html += '<div class="tile"><b>' + spdNow.toFixed(1) + 's</b><span>per problem, last 5</span>' +
          delta(spdNow, spdWas, false, function (d) { return d.toFixed(1) + 's'; }) +
          '</div>';
  html += '</div>';

  /* ---- sessions per week ---- */
  html += section('weeks', 'Sessions per week',
    '<div class="panel">' + barChart(weeks) +
    '<div class="cap">Last ' + CONFIG.WEEKS_SHOWN + ' weeks, Monday start.</div></div>');

  /* ---- trends ---- */
  var trend = sessions.slice(-CONFIG.TREND_SESSIONS);
  var tLabels = trend.map(function (s) {
    return (s.when.getMonth() + 1) + '/' + s.when.getDate();
  });

  var focusRounds = trend.filter(function (s) { return s.mode !== ''; }).length;
  var focusNote = focusRounds
    ? ' ' + focusRounds + ' of these drilled a single table, which is easier — ' +
      'they are marked in the list below.'
    : '';

  html += section('accuracy', 'Accuracy trend',
    '<div class="panel">' +
    lineChart(trend.map(function (s) { return s.accuracy * 100; }), tLabels, {
      min: 0, max: 100, color: '#31c48d',
      fmt: function (v) { return Math.round(v) + '%'; }
    }) +
    '<div class="cap">Last ' + trend.length + ' sessions.' + focusNote + '</div></div>');

  var allowed = SETTINGS[key] ? SETTINGS[key].secondsPerProblem : null;
  html += section('speed', 'Seconds per problem',
    '<div class="panel">' +
    lineChart(trend.map(function (s) { return s.perProblem; }), tLabels, {
      color: '#f7b955',
      fmt: function (v) { return v.toFixed(1) + 's'; }
    }) +
    '<div class="cap">Lower is faster.' +
    (allowed ? ' The timer currently allows ' + allowed + 's per problem.' : '') +
    '</div></div>');

  /* ---- trouble facts ---- */
  var tf = troubleFacts(sessions);
  var html2 = '';

  if (!tf.repeated.length) {
    html2 += '<div class="empty">No fact has been missed in ' + CONFIG.TROUBLE_MIN_SESSIONS +
            ' or more of the last ' + tf.windowSize + ' session' +
            (tf.windowSize === 1 ? '' : 's') + '.' +
            (tf.oneOffs.length
              ? '<br><br>' + tf.oneOffs.length + ' fact' +
                (tf.oneOffs.length > 1 ? 's were' : ' was') + ' missed once — treating that as noise.'
              : '') +
            '</div>';
  } else {
    html2 += '<div class="trouble">';
    tf.repeated.forEach(function (f) {
      var wrongs = Object.keys(f.answers).sort(function (a, b) {
        return f.answers[b] - f.answers[a];
      }).slice(0, 3);

      var bits = [];
      if (wrongs.length) {
        bits.push('said ' + wrongs.map(function (w) { return '<em>' + esc(w) + '</em>'; }).join(', '));
      }
      if (f.timeouts) bits.push('ran out of time ' + f.timeouts + '×');

      var hot = f.sessions >= Math.max(3, Math.ceil(tf.windowSize * 0.4));
      html2 += '<div class="trow">' +
                '<div class="fact">' + esc(f.key) + '</div>' +
                '<div class="meta">missed in <em>' + f.sessions + ' of the last ' +
                  tf.windowSize + '</em> sessions' +
                  (bits.length ? '<br>' + bits.join(' · ') : '') +
                '</div>' +
                '<div class="heat ' + (hot ? 'hot' : 'warm') + '">' + f.misses + ' miss' +
                  (f.misses === 1 ? '' : 'es') + '</div>' +
              '</div>';
    });
    html2 += '</div>';
    if (tf.oneOffs.length) {
      html2 += '<div class="cap" style="padding:10px 4px;color:#9fb0d0;font-size:12px">' +
              tf.oneOffs.length + ' other fact' + (tf.oneOffs.length > 1 ? 's were' : ' was') +
              ' missed in only one session — filtered out as noise.</div>';
    }
  }
  html += section('trouble', 'Trouble facts', html2);

  /* ---- recent sessions ---- */
  var recentHtml = '';
  sessions.slice(-CONFIG.RECENT_SESSIONS_SHOWN).reverse().forEach(function (s) {
    var cls = s.accuracy >= 0.9 ? 'a' : (s.accuracy >= 0.75 ? 'b' : 'c');
    var when = s.when.toLocaleDateString([], { weekday: 'short', month: 'numeric', day: 'numeric' }) +
               ', ' + s.when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    var missTxt = s.missed.length
      ? s.missed.map(function (m) { return m.a + '×' + m.b; }).join(', ')
      : 'no misses';
    var mode = s.mode === '' ? '' : ' · <b class="mode">' + esc(s.mode) + '× table</b>';

    recentHtml += '<div class="session">' +
              '<div class="when">' + esc(when) +
                '<small>' + mmss(s.elapsed) + ' · ' + s.perProblem.toFixed(1) +
                's per problem' + mode + '<br>' + esc(missTxt) + '</small>' +
              '</div>' +
              '<div class="badge ' + cls + '">' + s.score + '/' + s.total + '</div>' +
            '</div>';
  });
  html += section('recent', 'Recent sessions', recentHtml);

  /* ---- settings ---- */
  html += section('settings', esc(displayName(key)) + '&rsquo;s settings',
                  settingsCard(key), false);
  if (!STALE_SCRIPT) html += section('addkid', 'Add a kid', addKidCard(), false);
  html += sheetLink();

  el('content').innerHTML = html;
  wireSettings(key);
  wireAddKid();
  wireSections();
}

el('refreshBtn').addEventListener('click', load);
load();
</script>
</body>
</html>
